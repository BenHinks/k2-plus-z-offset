# =====================================================================
#  K2 Plus: Z offset by filament type + build plate
#  File: k2_zoffset.cfg  (upload to Fluidd > Configuration)
#  Add this line near the top of printer.cfg:   [include k2_zoffset.cfg]
#
#  Slicer start G-code: call it right AFTER the START_PRINT line
#  (Creality's START_PRINT runs SET_GCODE_OFFSET Z=0, which would wipe it):
#
#  SET_ZOFFSET_BY_MATERIAL FILAMENT="{filament_type[initial_no_support_extruder]}" PLATE="{curr_bed_type}"
#
#  Optional params:  BASE=0.03   (overrides variable_base for one print)
#
#  Positive values = nozzle HIGHER (less squish). Negative = closer.
# =====================================================================

[gcode_macro SET_ZOFFSET_BY_MATERIAL]
description: Set Z offset from filament type + build plate (call after START_PRINT)

# ---- Your baseline offset for PLA on your "reference" plate ----------
variable_base: 0.0

# ---- Safety limits: final offset is clamped into this range ---------
variable_min_offset: -0.10
variable_max_offset: 0.40

gcode:
    # ---------------- EDIT THESE TABLES ------------------------------
    # Filament adjustments (mm), added to base. Matched on the start of
    # the slicer's filament type, longest match wins, so "PETG-CF" uses
    # PETG, and "PLA-CF" falls back to PLA unless you add PLA-CF itself.
    {% set filament_adj = {
        'PLA':    0.000,
        'PLA-CF': 0.010,
        'PETG':   0.030,
        'PET':    0.025,
        'ABS':    0.020,
        'ASA':    0.020,
        'TPU':    0.050,
        'PA':     0.020,
        'PC':     0.020,
        'HIPS':   0.020,
        'PVA':    0.000,
    } %}

    # Plate adjustments (mm), added to base. Keys are the names OrcaSlicer
    # sends (exact match, case-insensitive). Each physical plate is
    # assigned its own OrcaSlicer bed type:
    #   textured pei plate  = stock Creality textured PEI
    #   high temp plate     = epoxy resin plate ("Smooth High Temp Plate")
    #   engineering plate   = PEO side
    #   textured cool plate = PET side (use 'cool plate' if it is smooth)
    #   cool plate          = spare ("Smooth Cool Plate")
    #   supertack plate     = holographic ("Cool Plate (SuperTack)")
    {% set plate_adj = {
        'textured pei plate':     0.000,
        'high temp plate':        0.000,
        'engineering plate':      0.000,
        'textured cool plate':    0.000,
        'cool plate':             0.000,
        'supertack plate':        0.000,
        'cool plate (supertack)': 0.000,
    } %}
    # -----------------------------------------------------------------

    {% set cfg = printer["gcode_macro SET_ZOFFSET_BY_MATERIAL"] %}
    {% set base = params.BASE|default(cfg.base)|float %}
    {% set fil  = params.FILAMENT|default('PLA')|string|upper|trim %}
    {% set plate = params.PLATE|default('')|string|lower|trim %}

    # Filament: longest-prefix match
    {% set ns = namespace(f_key='none', f_len=0, f_val=0.0, p_key='none', p_val=0.0) %}
    {% for key, val in filament_adj.items() %}
        {% if fil.startswith(key) and key|length > ns.f_len %}
            {% set ns.f_key = key %}
            {% set ns.f_len = key|length %}
            {% set ns.f_val = val|float %}
        {% endif %}
    {% endfor %}

    # Plate: exact name match
    {% for key, val in plate_adj.items() %}
        {% if key == plate %}
            {% set ns.p_key = key %}
            {% set ns.p_val = val|float %}
        {% endif %}
    {% endfor %}

    {% set raw = base + ns.f_val + ns.p_val %}
    {% set final = [ [raw, cfg.min_offset|float]|max, cfg.max_offset|float ]|min %}

    {action_respond_info(
        "Z offset: filament '%s' -> %s (%+.3f), plate '%s' -> %s (%+.3f), base %+.3f => %.3f%s"
        % (fil, ns.f_key, ns.f_val, plate, ns.p_key, ns.p_val, base, final,
           "" if final == raw else "  (CLAMPED from %.3f)" % raw)
    )}

    SET_GCODE_OFFSET Z={final} MOVE=1
